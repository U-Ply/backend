name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

# 같은 PR 에 연속 푸시하면 이전 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        run: ./gradlew spotlessCheck

       # build -x test 는 compileTestJava 까지 함께 스킵한다.
      # 테스트 코드가 컴파일조차 안 되는 상태로 머지된 적이 있어 별도 스텝으로 분리한다.
      # 실제 테스트가 생기면 -x test 를 빼고 services 로 mysql/redis 를 추가한다.
      - name: Build
        run: ./gradlew build -x test

      - name: Compile tests          # ← 추가
        run: ./gradlew testClasses
