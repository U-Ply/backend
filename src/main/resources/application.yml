spring:
  application:
    name: coupon-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:coupon_db}?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:coupon}
    password: ${DB_PASSWORD:coupon1234}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: coupon-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  batch:
    jdbc:
     initialize-schema: always
    job:
      enabled: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always

# 발급 전략 선택. 재빌드 없이 환경변수로 바꿀 수 있다.
# NO_LOCK / PESSIMISTIC_LOCK / LUA_SCRIPT
coupon:
  issue:
    strategy: ${COUPON_STRATEGY:LUA_SCRIPT}
  idempotency:
    # Level 2의 순수 전략 비교에서만 false로 설정한다. 일반 실행에서는 Redis 멱등성을 사용한다.
    enabled: ${COUPON_IDEMPOTENCY_ENABLED:true}
  save:
    strategy: ${COUPON_SAVE_STRATEGY:sync-db} # sync-db 또는 kafka
