spring:
  application:
    name: coupon-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:coupon_db}?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:coupon}
    password: ${DB_PASSWORD:coupon1234}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: coupon-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  batch:
    jdbc:
     initialize-schema: always
    job:
      enabled: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: coupon-service

# 발급 전략 선택. 재빌드 없이 환경변수로 바꿀 수 있다.
# NO_LOCK / PESSIMISTIC_LOCK / LUA_SCRIPT
coupon:
  issue:
    strategy: ${COUPON_STRATEGY:LUA_SCRIPT}
  idempotency:
    # Level 2의 순수 전략 비교에서만 false로 설정한다. 일반 실행에서는 Redis 멱등성을 사용한다.
    enabled: ${COUPON_IDEMPOTENCY_ENABLED:true}
  save:
    strategy: ${COUPON_SAVE_STRATEGY:sync-db} # sync-db 또는 kafka
  reconciliation:
    # 부하 테스트에서는 false로 두고 Kafka lag=0, DLT=0 확인 후 관리자 API로 수동 실행한다.
    # 멀티 인스턴스에서는 배치 담당 인스턴스 한 대만 true로 설정한다.
    scheduler-enabled: ${RECONCILIATION_SCHEDULER_ENABLED:false}
    initial-delay: ${RECONCILIATION_INITIAL_DELAY:PT1M}
    fixed-delay: ${RECONCILIATION_FIXED_DELAY:PT5M}
  cache-recovery:
    # CAMPAIGN_NOT_CACHED가 짧은 시간창 안에 threshold-count회 이상 발생하면
    # recoverMissingCache를 자동 트리거한다. 기본 비활성화 — 수동 관리자 API(2단계)로
    # 충분히 검증한 뒤 팀 합의로 켠다. 여러 인스턴스가 동시에 켜도 Redis 분산 락으로
    # 한 대만 실제 복구를 실행한다.
    auto-trigger-enabled: ${CACHE_RECOVERY_AUTO_TRIGGER_ENABLED:false}
    threshold-count: ${CACHE_RECOVERY_THRESHOLD_COUNT:5}
    window-seconds: ${CACHE_RECOVERY_WINDOW_SECONDS:5}
    lock-seconds: ${CACHE_RECOVERY_LOCK_SECONDS:30}
  verification:
        # CLOCK-02 의 Redis-DB 시계 허용 오차.
        # INV-04(이력 순서) · INV-06(시각 순서) · INV-11(캠페인 기간)의 경계가 밀리초라
        # 1.0초는 너무 느슨했다. 같은 호스트의 컨테이너면 실제 drift 는 거의 0 이다.
        # 측정값에는 Redis TIME 과 NOW(3) 를 순차로 읽는 왕복 2회가 섞이므로
        # 그 잡음보다는 크게 잡는다. 실측 후 조정한다.
        redis-clock-tolerance-sec: ${REDIS_CLOCK_TOLERANCE_SEC:0.3}
  status-stream:
    poll-interval-ms: ${STATUS_STREAM_POLL_INTERVAL_MS:1000}
    heartbeat-interval-ms: ${STATUS_STREAM_HEARTBEAT_INTERVAL_MS:15000}
    timeout-ms: ${STATUS_STREAM_TIMEOUT_MS:1800000}
    reconnect-time-ms: ${STATUS_STREAM_RECONNECT_TIME_MS:3000}
