# Grafana가 기동하면서 자동으로 읽는다. 손으로 데이터소스를 추가할 필요가 없다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # 대시보드 JSON이 이 uid를 직접 참조한다. 바꾸면 모든 패널이 데이터소스를 잃는다.
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # prometheus.yml의 scrape_interval과 맞춘다. 어긋나면 rate() 구간이 비어 톱니처럼 보인다.
      timeInterval: 5s
